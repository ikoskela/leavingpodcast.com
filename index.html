<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LEAVING.</title>
<meta name="description" content="LEAVING. is a narrated podcast about leaving the United States and building a life abroad, and what I've learned along the way.">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/assets/leaving-icon-180.png">
<meta property="og:title" content="LEAVING.">
<meta property="og:description" content="The New American Dream Is to Leave. (and now it's time to figure out how)">
<meta property="og:image" content="https://leavingpodcast.com/assets/leaving-og-wordmark-black-1200x630.png">
<meta property="og:url" content="https://leavingpodcast.com/">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
  :root { --yellow: #FCDA1E; --ink: #000; --white: #fff; --grey: #9a9a9a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ink); color: var(--white); }
  body {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 48px 20px; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center;
  }
  .lockup { display: flex; align-items: center; gap: 28px; max-width: 960px; width: 100%; justify-content: center; }
  .wordmark { width: min(46vw, 440px); height: auto; display: block; }
  .tags { text-align: left; font-family: Anton, Impact, sans-serif; text-transform: uppercase; color: var(--yellow);
          font-size: clamp(20px, 3.1vw, 34px); line-height: 1.05; letter-spacing: .01em; }
  .tags small { display: block; margin-top: .45em; text-transform: none; color: var(--white); font-size: .52em; letter-spacing: .02em; }
  p.about { max-width: 560px; margin: 44px auto 0; font-size: 18px; line-height: 1.5; color: #e8e8e8; }
  .links { margin-top: 32px; display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 360px; }
  .links a {
    display: block; padding: 16px 20px; border-radius: 999px; background: var(--yellow); color: var(--ink);
    font-family: Anton, Impact, sans-serif; font-size: 20px; letter-spacing: .03em; text-decoration: none; text-transform: uppercase;
  }
  .links a:hover, .links a:focus-visible { background: var(--white); outline: none; }
  footer { margin-top: 56px; font-size: 13px; color: var(--grey); }
  @media (max-width: 640px) {
    .lockup { flex-direction: column; gap: 18px; }
    .wordmark { width: min(86vw, 420px); }
    .tags { text-align: center; font-size: 24px; }
    .tags small { font-size: .62em; }
  }
</style>
</head>
<body>
  <main>
    <h1 class="lockup" style="margin:0;font-weight:normal">
      <img class="wordmark" src="/assets/leaving-wordmark-yellow.svg" alt="LEAVING." width="440" height="130">
      <span class="tags">The New American Dream<br>Is to Leave.<small>(and now it's time to figure out how)</small></span>
    </h1>
    <p class="about">LEAVING. is a narrated podcast about leaving the United States and building a life abroad, and what I've learned along the way.</p>
    <nav class="links" style="margin-left:auto;margin-right:auto">
      <a href="https://www.youtube.com/@leavingpodcast">Listen on YouTube</a>
    </nav>
  </main>
  <footer>Not financial, legal, or tax advice.</footer>
</body>
</html>
